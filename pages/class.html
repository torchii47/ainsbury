<body>

    <a class="skip-link" href="#main">Skip to content</a>

    <div class="site post-page">

        <nav class="nav" aria-label="Class">
            <a href="../index.html">&larr; Home</a>
            <a href="term.html">Term Planner</a>
        </nav>

        <main id="main">
        <section class="window">
            <div class="title-bar">
                <span class="title-bar-text">class_page.txt</span>
                <div class="title-bar-controls" aria-hidden="true"><span>_</span><span>□</span><span>×</span></div>
            </div>
            <div class="window-body">
                <h1 class="site-title">Class Page</h1>
                <p class="page-intro">For students in my own classes. Everything else on the site is open to everyone.</p>
                <ul class="info-list">
                    <li><a href="term.html">Term planner</a></li>
                    <li><a href="https://neocities.org/dashboard" target="_blank" rel="noopener">Neocities dashboard</a></li>
                </ul>
            </div>
        </section>

        <!-- Posts are listed in posts/posts.js -->
        <section class="window" id="resources">
            <div class="title-bar">
                <h2>resources_and_notes/</h2>
                <div class="title-bar-controls" aria-hidden="true"><span>_</span><span>□</span><span>×</span></div>
            </div>
            <div class="window-body">
                <ul id="post-list"></ul>
            </div>
        </section>
        </main>

    </div>

    <script src="../posts/posts.js?v=2026-10-29"></script>
    <script>
        // Lesson posts, newest first
        const postList = document.getElementById('post-list');

        if (typeof posts !== 'undefined' && Array.isArray(posts) && posts.length > 0) {
            postList.innerHTML = posts
                .sort((a, b) => new Date(b.date) - new Date(a.date))
                .map((post, index) => `
                    <li>
                        <a href="../${post.filename}">${post.title}</a>
                        <span class="post-date"> — ${post.date}</span>
                        ${index === 0 ? '<span class="new-tag blink">NEW!</span>' : ''}
                    </li>
                `).join('');
        } else {
            postList.innerHTML = '<li>No resources currently available.</li>';
        }
    </script>

    <script src="../js/windows.js?v=2026-10-29"></script>
